[project]
name = "ipdump"
version = "0.1.0"
description = "Incremental Instapaper mirror with plain-Markdown export"
authors = [
    { name = "Attila GOLONCSER", email = "agl@glnc.hu" }
]
requires-python = ">=3.14"
dependencies = [
    "instapaper-api>=1.0.0",
    "markdownify>=1.2.3",
]

[project.scripts]
ipdump = "ipdump:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ipdump.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
